# Debt mapping template — raw source column → normalized column.
# Vendor-neutral v5.1 stub. The worked example below is illustrative; a real
# adapter fork fills in per-source column names.
loan:
  source_format: [csv, jsonl]
  dedup_rule:
    keys: [loan_id]
    tie_breaker: latest_extracted_at_wins
  as_of_handling:
    carry_field: source_date
    allow_backfill: false
  fields:
    - { source_column: loan_id,        normalized_column: loan_id,           transform: trim_string,      required: true }
    - { source_column: prop_id,        normalized_column: property_id,       transform: trim_string,      required: true }
    - { source_column: lender_name,    normalized_column: lender,            transform: trim_string,      required: true }
    - { source_column: orig_bal_usd,   normalized_column: original_balance,  transform: dollars_to_cents, required: true }
    - { source_column: curr_bal_usd,   normalized_column: current_balance,   transform: dollars_to_cents, required: true }
    - { source_column: rate_type,      normalized_column: rate_type,         transform: map_rate_type,    required: true }
    - { source_column: all_in_rate,    normalized_column: all_in_rate,       transform: to_number,        required: true }
    - { source_column: orig_date,      normalized_column: origination_date,  transform: to_iso_date,      required: true }
    - { source_column: mat_date,       normalized_column: maturity_date,     transform: to_iso_date,      required: true }
    - { source_column: borrower_id,    normalized_column: entity_id,         transform: trim_string,      required: false }
    - { source_column: rate_index,     normalized_column: index,             transform: trim_string,      required: false }
    - { source_column: spread_bps,     normalized_column: spread_bps,        transform: to_integer,       required: false }
    - { source_column: covenants,      normalized_column: covenant_set,      transform: to_array,         required: false }
