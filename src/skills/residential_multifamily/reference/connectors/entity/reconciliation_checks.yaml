checks:
- check_id: entity_record_count
  check_kind: record_count
  severity: blocker
  description: Raw row count minus rejects equals normalized row count for legal_entity.
  inputs:
  - reference/raw/entity/<YYYY>/<MM>/<source>__<as_of>.*
  - reference/normalized/entity_legal_entity__<scope>.csv
  expected_invariant: count(raw) - count(rejected) == count(normalized)
  remediation: See qa/record_count.yaml.
- check_id: entity_duplicate_primary_key
  check_kind: duplicate_id
  severity: blocker
  description: No duplicate entity_id across legal_entity.
  inputs:
  - reference/normalized/entity_legal_entity__<scope>.csv
  expected_invariant: count(distinct entity_id) == count(records)
  remediation: See qa/duplicate_id.yaml.
- check_id: entity_null_critical_field
  check_kind: null_critical
  severity: blocker
  description: Required fields on legal_entity are non-null in normalized output.
  inputs:
  - reference/normalized/entity_legal_entity__<scope>.csv
  - reference/connectors/entity/schema.yaml
  expected_invariant: 'for each required field: count(null) == 0'
  remediation: See qa/null_critical_field.yaml.
