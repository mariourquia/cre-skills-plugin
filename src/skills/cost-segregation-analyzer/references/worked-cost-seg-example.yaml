---
# Cost Segregation Analyzer Worked Example
# $10M MF Acquisition with Component Reclassification
# Statute basis: IRC Section 168(k) as amended by the One Big Beautiful Bill
#   Act (OBBBA, enacted 2025-07-04). Last verified 2026-06-03.
# Placed in service 2026-01-15 (after 2025-01-19) -> PERMANENT 100% bonus.
#   (Placements on or before 2025-01-19 stay on the TCJA phase-down; see the
#   `bonus_sensitivity` block for the lower-rate / decoupled-state cases.)
# Advisory only -- not tax or legal advice. A qualified engineering-based study
#   and CPA review are required, and state conformity must be verified.
# All dollar amounts in USD
---

example:
  id: cost_seg_example_01
  name: "$10M Multifamily -- Cost Segregation Study with OBBBA Permanent 100% Bonus"
  description: >
    $10M acquisition of a 60-unit Class B multifamily in East Orange, NJ,
    placed in service 2026-01-15. Land value $2M (20% of purchase). Cost
    segregation study reclassifies building components into accelerated
    recovery classes. Because the property is placed in service after
    2025-01-19, OBBBA's permanent 100% bonus applies. Analysis includes the
    year-1 100% bonus, year-by-year tax savings, NPV of benefit, and recapture
    at year 7 disposition.

  # -------------------------------------------------------------------
  # ACQUISITION INPUTS
  # -------------------------------------------------------------------
  acquisition:
    property: "60-Unit Class B MF, East Orange NJ"
    purchase_price: 10_000_000
    closing_costs_capitalized: 150_000     # title, legal, transfer tax (capitalizable)
    total_cost_basis: 10_150_000
    land_value: 2_000_000                  # 20% -- assessed/appraised land allocation
    depreciable_basis: 8_150_000           # 10,150,000 - 2,000,000
    acquisition_date: "2026-01-15"
    property_type: "Residential rental (27.5-year MACRS)"
    entity: "Single-member LLC treated as disqualified S-corp for tax"
    investor_tax_profile:
      ordinary_income_rate: 0.37          # federal
      state_income_rate: 0.089            # NJ top rate
      combined_marginal_rate: 0.40        # blended federal + state (net of SALT deduction limitations)
      capital_gains_rate: 0.238           # 20% federal + 3.8% NIIT
      depreciation_recapture_rate: 0.25   # Section 1250 unrecaptured gain (25%)

  # -------------------------------------------------------------------
  # WITHOUT COST SEGREGATION (Straight-Line Only)
  # -------------------------------------------------------------------
  without_cost_seg:
    description: "All building improvements depreciated over 27.5 years straight-line"
    depreciable_basis: 8_150_000
    recovery_period: 27.5
    annual_depreciation: 296_364           # 8,150,000 / 27.5
    annual_tax_savings: 118_545            # 296,364 * 0.40
    cumulative_depreciation_7yr: 2_074_548  # 296,364 * 7
    cumulative_tax_savings_7yr: 829_819

  # -------------------------------------------------------------------
  # COST SEGREGATION STUDY RESULTS
  # -------------------------------------------------------------------
  cost_seg_study:
    description: >
      Engineered cost segregation study performed by qualified firm.
      Components are reclassified from 27.5-year residential into
      5-year personal property, 15-year land improvements, and
      remaining 27.5-year structural.

    study_cost: 18_000                     # typical cost for 60-unit MF
    study_firm: "Hypothetical CPA Engineering Firm"
    methodology: "Detailed engineering approach with site inspection"

    component_reclassification:
      five_year_property:
        description: "Personal property -- carpeting, appliances, cabinetry, window treatments, specialty lighting, security systems, signage"
        pct_of_depreciable_basis: 0.15
        amount: 1_222_500                  # 8,150,000 * 15%
        recovery_method: "200% declining balance, 5-year"
        items:
          - { item: "Carpeting & vinyl flooring", amount: 210_000, note: "60 units * $3,500 avg" }
          - { item: "Kitchen appliances (ranges, refrigerators, dishwashers)", amount: 180_000 }
          - { item: "Kitchen cabinetry & countertops", amount: 270_000 }
          - { item: "Window treatments (blinds, shades)", amount: 42_000 }
          - { item: "Bathroom vanities & fixtures", amount: 156_000 }
          - { item: "Interior lighting fixtures (non-structural)", amount: 84_000 }
          - { item: "Security/intercom system", amount: 65_000 }
          - { item: "Signage (exterior, directory)", amount: 18_000 }
          - { item: "Laundry equipment (common area)", amount: 45_000 }
          - { item: "Miscellaneous personal property", amount: 152_500 }

      fifteen_year_property:
        description: "Land improvements -- parking lot/curbing, sidewalks, landscaping, fencing, exterior lighting, drainage, retaining walls"
        pct_of_depreciable_basis: 0.10
        amount: 815_000                    # 8,150,000 * 10%
        recovery_method: "150% declining balance, 15-year"
        items:
          - { item: "Parking lot (asphalt, striping)", amount: 285_000 }
          - { item: "Concrete curbing", amount: 62_000 }
          - { item: "Sidewalks & walkways", amount: 95_000 }
          - { item: "Landscaping (trees, shrubs, irrigation)", amount: 125_000 }
          - { item: "Perimeter fencing", amount: 48_000 }
          - { item: "Exterior site lighting", amount: 72_000 }
          - { item: "Storm drainage system", amount: 88_000 }
          - { item: "Retaining walls (non-structural)", amount: 40_000 }

      twenty_seven_five_year_structural:
        description: "Remaining structural components -- building shell, HVAC distribution, plumbing risers, electrical service, roof, elevators"
        pct_of_depreciable_basis: 0.75
        amount: 6_112_500                  # 8,150,000 * 75%
        recovery_method: "Straight-line, 27.5-year"

    allocation_summary:
      headers: ["Class", "Amount", "Pct", "Recovery", "Method"]
      rows:
        - ["5-year Personal Property",  1_222_500, "15%", "5 years",    "200% DB / HY convention"]
        - ["15-year Land Improvements",    815_000, "10%", "15 years",   "150% DB / HY convention"]
        - ["27.5-year Structural",       6_112_500, "75%", "27.5 years", "Straight-line"]
        - ["Land (non-depreciable)",     2_000_000, "N/A", "N/A",        "N/A"]
        - ["TOTAL",                     10_150_000, "100%", "",           ""]

  # -------------------------------------------------------------------
  # BONUS DEPRECIATION PHASE-DOWN
  # -------------------------------------------------------------------
  bonus_depreciation:
    description: >
      IRC Section 168(k) as amended by OBBBA (2025). This property is placed in
      service 2026-01-15 (after 2025-01-19), so the PERMANENT 100% bonus
      applies to qualifying assets (5-year and 15-year property). Bonus applies
      to the ENTIRE depreciable amount in the qualifying class, so both classes
      are fully expensed in year 1. Real property (27.5-year) never qualifies.
    schedule:
      "2017_2022": 1.00    # 100% bonus (TCJA)
      "2023": 0.80         # 80% (TCJA phase-down)
      "2024": 0.60         # 60% (TCJA phase-down)
      "2025_on_before_jan19": 0.40   # 40% (TCJA phase-down)
      "2025_after_jan19": 1.00       # 100% (OBBBA permanent)
      "2026_and_later": 1.00         # 100% (OBBBA permanent)
    placed_in_service: "2026-01-15"
    regime: "OBBBA permanent 100% (placed in service after 2025-01-19)"
    bonus_rate: 1.00

    application:
      five_year_property:
        basis: 1_222_500
        bonus_pct: 1.00
        bonus_amount: 1_222_500            # 1,222,500 * 100%
        remaining_basis: 0                 # fully expensed in year 1
        remaining_depreciation: "None -- 5-year class fully bonus-depreciated"

      fifteen_year_property:
        basis: 815_000
        bonus_pct: 1.00
        bonus_amount: 815_000              # 815,000 * 100%
        remaining_basis: 0                 # fully expensed in year 1
        remaining_depreciation: "None -- 15-year class fully bonus-depreciated"

      total_bonus_year_1: 2_037_500        # 1,222,500 + 815,000
      bonus_note: >
        At the permanent 100% bonus restored by OBBBA, the full $2.0375M of
        qualifying 5-year and 15-year property is expensed in year 1. This is a
        far larger year-1 deduction than the 20% phase-down rate ($407.5K) that
        applied under the pre-OBBBA TCJA schedule for 2026 placements. State
        conformity must be checked separately -- a non-conforming state (e.g.,
        California) requires a separate state depreciation computation.

  # -------------------------------------------------------------------
  # YEAR-BY-YEAR DEPRECIATION AND TAX SAVINGS
  # -------------------------------------------------------------------
  annual_schedule:
    description: >
      Complete 7-year depreciation schedule comparing cost seg vs straight-line
      at the OBBBA permanent 100% bonus rate. With 100% bonus, the 5-year and
      15-year classes are fully expensed in year 1, so years 2-7 carry only the
      27.5-year structural straight-line ($222,273/yr). The crossover is
      immediate: from year 2 on, the without-cost-seg baseline (which spreads
      the entire $8.15M over 27.5 years) deducts more per year than the
      cost-seg case, whose accelerated classes are already exhausted.

    headers: ["Year", "5yr Depr", "15yr Depr", "27.5yr Depr", "Bonus", "Total CostSeg", "Straight-Line", "Incremental", "Tax Savings @ 40%", "Cumulative Savings"]

    rows:
      - year: 1
        five_yr: 0             # fully expensed via 100% bonus (shown in bonus column)
        fifteen_yr: 0          # fully expensed via 100% bonus (shown in bonus column)
        structural: 222_273    # 6,112,500 / 27.5
        bonus: 2_037_500       # 100% bonus on 5yr ($1,222,500) + 15yr ($815,000)
        total_cost_seg: 2_259_773
        straight_line: 296_364
        incremental: 1_963_409
        tax_savings: 785_364   # 1,963,409 * 0.40
        cumulative_savings: 785_364

      - year: 2
        five_yr: 0
        fifteen_yr: 0
        structural: 222_273
        bonus: 0
        total_cost_seg: 222_273
        straight_line: 296_364
        incremental: -74_091   # accelerated classes exhausted; SL baseline now higher
        tax_savings: -29_636
        cumulative_savings: 755_728

      - year: 3
        five_yr: 0
        fifteen_yr: 0
        structural: 222_273
        bonus: 0
        total_cost_seg: 222_273
        straight_line: 296_364
        incremental: -74_091
        tax_savings: -29_636
        cumulative_savings: 726_092

      - year: 4
        five_yr: 0
        fifteen_yr: 0
        structural: 222_273
        bonus: 0
        total_cost_seg: 222_273
        straight_line: 296_364
        incremental: -74_091
        tax_savings: -29_636
        cumulative_savings: 696_456

      - year: 5
        five_yr: 0
        fifteen_yr: 0
        structural: 222_273
        bonus: 0
        total_cost_seg: 222_273
        straight_line: 296_364
        incremental: -74_091
        tax_savings: -29_636
        cumulative_savings: 666_820

      - year: 6
        five_yr: 0
        fifteen_yr: 0
        structural: 222_273
        bonus: 0
        total_cost_seg: 222_273
        straight_line: 296_364
        incremental: -74_091
        tax_savings: -29_636
        cumulative_savings: 637_184

      - year: 7
        five_yr: 0
        fifteen_yr: 0
        structural: 222_273
        bonus: 0
        total_cost_seg: 222_273
        straight_line: 296_364
        incremental: -74_091
        tax_savings: -29_636
        cumulative_savings: 607_548

    seven_year_totals:
      total_depreciation_cost_seg: 3_593_411   # 2,037,500 bonus + 7 * 222,273 structural
      total_depreciation_straight_line: 2_074_548
      incremental_depreciation: 1_518_863
      total_incremental_tax_savings: 607_548
      note: >
        At 100% bonus, cost seg pulls $2.0375M of qualifying property entirely
        into year 1, producing a $785K year-1 tax saving. From year 2 the
        cost-seg case deducts less than the straight-line baseline (the
        accelerated classes are gone), so cumulative savings drift down toward
        the timing benefit. This is NOT a permanent tax saving -- total
        depreciation over the asset life is identical; the value is the time
        value of the large year-1 deduction, captured in the NPV below.

  # -------------------------------------------------------------------
  # NPV OF TAX BENEFIT
  # -------------------------------------------------------------------
  npv_analysis:
    description: >
      NPV of incremental tax savings from cost segregation vs. straight-line,
      discounted at investor's opportunity cost of capital.
    discount_rate: 0.08                    # 8% opportunity cost
    incremental_savings_by_year:
      year_1: 785_364
      year_2: -29_636
      year_3: -29_636
      year_4: -29_636
      year_5: -29_636
      year_6: -29_636
      year_7: -29_636
    pv_factors:
      year_1: 0.9259
      year_2: 0.8573
      year_3: 0.7938
      year_4: 0.7350
      year_5: 0.6806
      year_6: 0.6302
      year_7: 0.5835
    pv_by_year:
      year_1: 727_169
      year_2: -25_407
      year_3: -23_525
      year_4: -21_782
      year_5: -20_170
      year_6: -18_677
      year_7: -17_293
    npv_of_benefit: 600_315               # sum of PV by year
    less_study_cost: -18_000
    net_npv: 582_315
    roi_on_study: 33.4                     # 600,315 / 18,000 ~= 33x (before recapture)
    note: >
      The cost seg study costs $18K and generates ~$600K in NPV tax benefit
      (before recapture) at the OBBBA permanent 100% bonus rate. The large
      year-1 deduction ($785K tax saving) dominates the small negative-timing
      tail in years 2-7. By contrast, at the dead 20% phase-down rate that
      applied pre-OBBBA for 2026 placements, NPV would have been roughly $200K.

  # -------------------------------------------------------------------
  # DEPRECIATION RECAPTURE AT YEAR 7 DISPOSITION
  # -------------------------------------------------------------------
  recapture_analysis:
    description: >
      When the property is sold in year 7, accelerated depreciation must be
      recaptured. Section 1250 recapture taxes the excess of accelerated over
      straight-line depreciation at 25%, and remaining gain at capital gains rate.
    disposition_year: 7
    sale_price: 13_500_000                 # assumed 35% appreciation over 7 years
    selling_costs: 202_500                 # 1.5%
    net_sale_proceeds: 13_297_500

    cost_seg_recapture:
      original_basis: 10_150_000
      total_depreciation_taken: 3_593_411
      adjusted_basis: 6_556_589            # 10,150,000 - 3,593,411
      gain_on_sale: 6_740_911              # 13,297,500 - 6,556,589
      section_1250_recapture:
        description: >
          Simplified: the 25% unrecaptured-1250 rate is applied to the full
          depreciation taken (this worked example treats all reclassified
          depreciation at 25% for tractability). In a detailed model, 5-year
          personal property is Section 1245 recapture at ordinary rates and
          only the real-property depreciation is unrecaptured 1250 at 25%; a
          full study would split these. The 100% bonus increases total
          depreciation taken (and thus recapture) versus straight-line.
        total_depreciation_taken: 3_593_411
        recapture_amount: 3_593_411
        recapture_tax_rate: 0.25
        recapture_tax: 898_353
      remaining_capital_gain:
        amount: 3_147_500                  # 6,740,911 - 3,593,411
        tax_rate: 0.238                    # 20% + 3.8% NIIT
        tax: 749_105
      total_tax_on_sale: 1_647_458

    straight_line_recapture:
      original_basis: 10_150_000
      total_depreciation_taken: 2_074_548
      adjusted_basis: 8_075_452
      gain_on_sale: 5_222_048
      section_1250_recapture:
        recapture_amount: 2_074_548
        recapture_tax_rate: 0.25
        recapture_tax: 518_637
      remaining_capital_gain:
        amount: 3_147_500
        tax_rate: 0.238
        tax: 749_105
      total_tax_on_sale: 1_267_742

    recapture_comparison:
      additional_tax_from_cost_seg: 379_716   # 1,647,458 - 1,267,742
      additional_recapture_depreciation: 1_518_863
      effective_recapture_rate: 0.25          # 379,716 / 1,518,863
      note: >
        At 100% bonus the cost seg generates ~$608K in cumulative tax savings
        during the hold but triggers ~$380K in additional recapture tax at sale
        (more depreciation taken -> more recapture). The net is ~$228K nominal.
        On an NPV basis (the $785K year-1 saving is front-loaded, recapture is
        deferred to year 7), the net benefit is ~$600K - $222K = ~$379K. Still
        a strong ~20x return on the $18K study cost.

    net_benefit_summary:
      cumulative_tax_savings_during_hold: 607_548
      additional_recapture_at_sale: -379_716
      nominal_net_benefit: 227_832
      npv_of_savings: 600_315              # front-loaded (year-1 100% bonus)
      pv_of_recapture: -221_564            # 379,716 * 0.5835 (year 7 PV factor)
      npv_net_benefit: 378_751
      study_cost: -18_000
      npv_net_of_study: 360_751
      roi_on_study_net_of_recapture: 20.0  # 360,751 / 18,000 ~= 20x

  # -------------------------------------------------------------------
  # SENSITIVITY: BONUS DEPRECIATION RATE
  # -------------------------------------------------------------------
  bonus_sensitivity:
    description: >
      How NPV changes with the bonus rate. Base case is the OBBBA permanent
      100% (this property is placed in service after 2025-01-19). The lower
      rows model historical placements (on/before 2025-01-19) or states that
      decouple from federal bonus and require a reduced state computation.
    scenarios:
      - bonus_rate: 0.00
        year_1_total_depr: 507_523
        npv_net_of_recapture: 150_000
        note: "No bonus (e.g., a fully non-conforming state). Still worthwhile from MACRS acceleration alone."
      - bonus_rate: 0.40
        year_1_total_depr: 1_208_423
        npv_net_of_recapture: 240_000
        note: "Early-2025 (on/before Jan 19) TCJA rate, or a partially decoupled state."
      - bonus_rate: 0.60
        year_1_total_depr: 1_558_873
        npv_net_of_recapture: 290_000
        note: "2024 TCJA phase-down rate (historical placements)."
      - bonus_rate: 0.80
        year_1_total_depr: 1_909_323
        npv_net_of_recapture: 335_000
        note: "2023 TCJA phase-down rate (historical placements)."
      - bonus_rate: 1.00
        year_1_total_depr: 2_259_773
        npv_net_of_recapture: 360_751
        note: "OBBBA permanent 100% bonus. BASE CASE for placements after 2025-01-19. Year-1 deduction expenses the full $2.0375M of qualifying property."

  # -------------------------------------------------------------------
  # RECOMMENDATION
  # -------------------------------------------------------------------
  recommendation:
    proceed: true
    rationale:
      - "NPV of ~$361K net of recapture and study cost on an $18K investment = ~20x ROI at the permanent 100% bonus"
      - "Front-loaded tax savings improve cash-on-cash returns in year 1 when value-add carry is highest"
      - "Year 1 tax savings of $785K materially offsets negative carry during the renovation period"
      - "Even at 0% bonus (fully non-conforming state, worst case), NPV is ~$150K -- the study pays for itself regardless"
    timing_note: >
      Under OBBBA the 100% bonus is permanent for qualified property placed in
      service after 2025-01-19, so there is no year-end phase-down cliff to race
      against on the federal side. The remaining timing levers are (1) the
      placed-in-service date itself (the property must be placed in service, not
      merely acquired) and (2) state conformity -- confirm whether the taxing
      state couples to the federal 100% bonus or requires a separate, lower
      state depreciation computation.
    section_1031_interaction: >
      If a 1031 exchange is contemplated at disposition, recapture is deferred
      along with capital gains. Cost seg is even more attractive when combined
      with a 1031 exchange strategy because recapture is indefinitely deferred.
